# Argo CD Applications for the onprem cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harshitadagarwal-ops/k8s-microservices-app.git
    targetRevision: main
    path: charts/three-tier
    helm:
      valueFiles:
        - values.yaml
        - values-onprem.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowcontrol
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harshitadagarwal-ops/k8s-microservices-app.git
    targetRevision: main
    path: platform/flowcontrol/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-inventory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harshitadagarwal-ops/k8s-microservices-app.git
    targetRevision: main
    path: platform/service-inventory/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: reporting
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      valuesObject:
        controller:
          hostPort:
            enabled: true
          service:
            type: NodePort
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
