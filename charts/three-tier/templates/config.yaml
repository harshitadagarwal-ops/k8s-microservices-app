apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
data:
  DB_HOST: mysql
  DB_NAME: {{ .Values.mysql.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.auth.rootPassword | quote }}
  DB_USER: {{ .Values.auth.user | quote }}
  DB_PASSWORD: {{ .Values.auth.password | quote }}
