{{- $a := .Values.ingress.admin }}
{{- if $a.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-admin
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
spec:
  rules:
    - host: {{ $a.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}
{{- end }}
