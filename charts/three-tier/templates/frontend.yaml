{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "three-tier.labels" . | nindent 4 }}
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "three-tier.image" (list . $f) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $f.port }}
          env:
            - name: BACKEND_URL
              value: "http://backend:{{ .Values.backend.port }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $f.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
spec:
  type: {{ $f.service.type }}
  selector:
    app: frontend
  ports:
    - port: {{ $f.port }}
      targetPort: {{ $f.port }}
      {{- if and (eq $f.service.type "NodePort") $f.service.nodePort }}
      nodePort: {{ $f.service.nodePort }}
      {{- end }}
