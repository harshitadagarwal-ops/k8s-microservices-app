# staging-gke: Google Kubernetes Engine, europe-west1.

image:
  registry: europe-west1-docker.pkg.dev/example-staging/three-tier

mysql:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard-rwo

ingress:
  host: three-tier.staging.example.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-staging
