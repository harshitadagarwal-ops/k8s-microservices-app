apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-app-dev-aks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/k8s-microservices-app.git
    targetRevision: HEAD
    path: charts/three-tier
    helm:
      valueFiles:
        - values.yaml
        - values-dev-aks.yaml
  destination:
    server: https://aks-dev.eastus.cloudapp.azure.com
    namespace: demo
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev-aks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/k8s-microservices-app.git
    targetRevision: HEAD
    path: platform/overlays/dev-aks
  destination:
    server: https://aks-dev.eastus.cloudapp.azure.com
    namespace: default
---
# F04: cert-manager v1.16.2
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-dev-aks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    targetRevision: v1.16.2
    chart: cert-manager
    helm:
      values: |
        crds:
          enabled: true
  destination:
    server: https://aks-dev.eastus.cloudapp.azure.com
    namespace: cert-manager
---
# F06: ingress-nginx chart 4.11.3
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-dev-aks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.11.3
    chart: ingress-nginx
  destination:
    server: https://aks-dev.eastus.cloudapp.azure.com
    namespace: ingress-nginx
