# Frontend tier: Flask web UI — EKS version.
#
# Differences from manifests/04-frontend.yaml (Minikube):
#   - image pulled from Amazon ECR (replace <ECR_REGISTRY> as in the backend)
#   - exposed through an ALB Ingress instead of NodePort + `minikube service`.
#     The Service is ClusterIP (internal); the Ingress below tells the AWS Load
#     Balancer Controller to create one internet-facing Application Load Balancer
#     that routes HTTP traffic to the frontend pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: <ECR_REGISTRY>/three-tier/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://backend:5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service: ClusterIP (internal). The ALB Ingress targets this Service.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
# Ingress: the AWS Load Balancer Controller provisions ONE internet-facing ALB
# from this. target-type "ip" sends traffic straight to pod IPs (works with the
# VPC CNI). Health checks hit the frontend's /health endpoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: demo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
