# Backend tier: Flask REST API — EKS version.
#
# Difference from manifests/03-backend.yaml (Minikube):
#   The image is pulled from Amazon ECR instead of Minikube's local Docker,
#   and imagePullPolicy is Always so new pushes are picked up.
#
# The ECR registry prefix is applied by kustomization.yaml (images:), so this
# file keeps a plain base name. Deploy with: kubectl apply -k manifests-eks/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Base name; the real ECR registry is set by kustomization.yaml (images:).
          image: three-tier/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service: stable in-cluster name "backend" for the frontend to call.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
