# Backend tier: Flask REST API — EKS version.
#
# Difference from manifests/03-backend.yaml (Minikube):
#   The image is pulled from Amazon ECR instead of Minikube's local Docker,
#   and imagePullPolicy is Always so new pushes are picked up.
#
# Replace <ECR_REGISTRY> with your account's ECR registry, e.g.
#   105673693246.dkr.ecr.us-east-1.amazonaws.com
# (See README-EKS.md step "Build and push images".)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <ECR_REGISTRY>/three-tier/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service: stable in-cluster name "backend" for the frontend to call.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
