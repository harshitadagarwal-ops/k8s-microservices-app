# ConfigMap: NON-sensitive configuration shared by the app.
# The DB host is simply the MySQL Service name, thanks to cluster DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  DB_HOST: "mysql"
  DB_NAME: "appdb"
---
# Secret: SENSITIVE configuration (credentials).
# NOTE: Kubernetes Secrets are base64-encoded, NOT encrypted by default.
# stringData lets us write plain text; K8s stores it as a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: demo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  DB_USER: "appuser"
  DB_PASSWORD: "apppassword"
