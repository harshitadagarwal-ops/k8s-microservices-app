# F02 (fixed by Preflight): previously pinned to the flowcontrol.apiserver.k8s.io beta API
# version removed in Kubernetes 1.32. Updated to the v1 apiVersion so Argo CD sync succeeds
# against K8s 1.32+.
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: demo-batch-priority
spec:
  type: Limited
  limited:
    nominalConcurrencyShares: 20
    limitResponse:
      type: Queue
      queuing:
        queues: 16
        handShakeLength: 5
        queueLengthLimit: 50
---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: demo-batch-flowschema
spec:
  priorityLevelConfiguration:
    name: demo-batch-priority
  matchingPrecedence: 500
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: legacy-report-client-sa
            namespace: default
      resourceRules:
        - verbs: ["get", "list"]
          apiGroups: [""]
          resources: ["endpoints"]
