apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: report-client
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: report-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: report-client
subjects:
  - kind: ServiceAccount
    name: report-client
    namespace: reporting
