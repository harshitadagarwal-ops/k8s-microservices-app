# Service inventory report: counts backing addresses per service for the ops dashboard.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: service-inventory-report
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: report-client
          restartPolicy: Never
          containers:
            - name: report
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  curl -sf --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat $SA/token)" \
                    https://kubernetes.default.svc/api/v1/endpoints \
                    -o /tmp/inventory.json
                  echo "inventory bytes: $(wc -c < /tmp/inventory.json)"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
